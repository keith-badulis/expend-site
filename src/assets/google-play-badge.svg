  <!-- "Google Play" Text -->
  <text x="46" y="37" fill="#FFFFFF" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" letter-spacing="0.2px">Google Play</text>
