<svg width="175" height="52" viewBox="0 0 175 52" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Official Black Container with Border -->
  <rect x="0.5" y="0.5" width="174" height="51" rx="9.5" fill="#000000" stroke="#A6A6A6" stroke-width="1"/>

  <!-- Google Play Color Triangle Icon -->
  <g transform="translate(14, 12)">
    <!-- Top triangle (Green) -->
    <path d="M15.8 13.5L3.2 0.9C3.1 1.0 3 1.2 3 1.5v25c0 .3.1.5.2.6l12.6-13.6z" fill="#00E676"/>
